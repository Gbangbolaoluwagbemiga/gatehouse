# Gatehouse: a PR triage room where a maintainer team works with two agents.
#
# gatehouse-desk lists PatchBond's verdicts and routes the needs_human cases to a person.
# gatehouse-auditor re-checks every verdict's model signature before anyone acts on it.
# Each agent runs in its own folder of this repo (agents/desk, agents/auditor), where its
# CLAUDE.md gives it its role and the gatehouse CLI.
#
# Deploy: ask switch-buddy to run this file (or import it under Templates), with `checkout` = your
# clone and `where` = your team's room. Then, in that room: @gatehouse-desk triage
version: 1

params:
  checkout:
    type: string
    label: Gatehouse checkout
    description: Absolute path of your clone of this repo, e.g. /Users/you/gatehouse
    pattern: "/.+"
  provider:
    type: provider
    description: The coding agent behind both. The first one installed is chosen.
    default: [claude, codex]
    input: advanced
  location:
    type: location
    description: Where both run.
    default: local
    input: advanced
  where:
    type: room
    label: Room
    description: The maintainers' room both agents join, e.g. the Telegram group your Switch bot is in.
  help:
    type: room
    label: Contributors' help room (optional)
    description: A public room where contributors ask about their PR's verdict. The desk answers there and hands disputes to the maintainers' room.
    required: false

agents:
  - name: gatehouse-desk
    display_name: Gatehouse Desk
    description: Lists bonded PRs and their signed verdicts, and routes the doubtful ones to a maintainer
    addressing: anyone
    provider: "{provider}"
    location: "{location}"
    directory: "{checkout}/agents/desk"
    join: ["{where}", "{help}"]
    instructions: |
      You are gatehouse-desk. Read CLAUDE.md in your working directory first and follow it.
      In short: take the triage-desk role; on "triage" run `watch`/`queue` from ../../gatehouse/cli.ts,
      route each needs_human case to whoever `rota` names, ask @gatehouse-auditor to verify, record a
      maintainer's stated decision with `decide … --by @them`, and keep the Triage Board room document
      current. In the help room, answer contributors from the verdict and hand disputes to maintainers.
      Never claim money moved: maintainers sign refunds and forfeits themselves on the verdict page.
  - name: gatehouse-auditor
    display_name: Gatehouse Auditor
    description: Re-checks each verdict's model signature and published hash before people act on it
    addressing: owner-agents
    provider: "{provider}"
    location: "{location}"
    directory: "{checkout}/agents/auditor"
    join: ["{where}"]
    instructions: |
      You are gatehouse-auditor. Read CLAUDE.md in your working directory first and follow it.
      In short: take the verifier role; run `verify <ref>` from ../../gatehouse/cli.ts on every verdict
      the desk posts and reply in-thread with ✓/✗ and the signer (flag a changed signer); after each
      recorded decision run `log 1` and `check-ledger`; keep the Audit Log room document; post `digest`
      or `report` when asked. Never record decisions and never round a ✗ up.

